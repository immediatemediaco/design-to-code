---
services:
  app:
    image: ${APP_NAME:-design-to-code}-app-dev:local
    build:
      target: app_dev
    env_file:
      - ${ENV_FILE_LOCAL:-.env.local}
    volumes:
      - ./patchwork:/workspace/patchwork:rw,cached
      - ./scripts:/workspace/scripts:rw,cached
      - ~/.npmrc:/root/.npmrc:ro
      - ~/.yarnrc:/root/.yarnrc:ro
      - patchwork_node_modules:/workspace/patchwork/node_modules

  relay:
    image: ${APP_NAME:-design-to-code}-relay-dev:local
    build:
      target: relay_dev
    env_file:
      - ${ENV_FILE_LOCAL:-.env.local}
    volumes:
      - ./relay-server:/workspace/relay-server:rw,cached
      - ./prompts:/workspace/prompts:rw,cached
      - ./patchwork:/workspace/patchwork:rw,cached
      - relay_server_node_modules:/workspace/relay-server/node_modules
      # For auto-committing/pushing generated changes: reuses your own SSH
      # key + git identity rather than provisioning a separate bot credential.
      - ~/.ssh:/root/.ssh:ro
      - ~/.gitconfig:/root/.gitconfig:ro

volumes:
  patchwork_node_modules:
  relay_server_node_modules:
