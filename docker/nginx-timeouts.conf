# /generate can legitimately take minutes for large components: the model now
# produces three files (component + styles + test) per request, and vision
# input for a big screenshot slows generation further. nginx's default 60s
# proxy_read_timeout was closing the connection out from under the LLM
# response, which the Figma plugin then reported as "Could not reach relay
# server" — a generic network failure, not a CORS/app error.
proxy_connect_timeout 300s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
