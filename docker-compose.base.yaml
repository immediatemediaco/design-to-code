---
services:
  app:
    build:
      context: .
      dockerfile: ./docker/storybook-app.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
        BUILD_START_TIME: ${BUILD_START_TIME:-}
        LAST_COMMIT_DATE: ${LAST_COMMIT_DATE:-}
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      PORT: 9000
      STORYBOOK_PORT: 9001
      RELAY_TARGET: ${RELAY_TARGET:-http://relay:4000}
    depends_on:
      - relay
    extra_hosts:
      - "host.docker.internal:host-gateway"

  relay:
    build:
      context: .
      dockerfile: ./docker/relay-server.Dockerfile
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      PORT: 4000
      GENERATED_DIR: /workspace/patchwork/packages/components/src/generated
      GENERATED_COMPONENT_FORMAT: patchwork
      PATCHWORK_ROOT: /workspace/patchwork
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    volumes:
      - type: bind
        source: ./docker/nginx-timeouts.conf
        target: /etc/nginx/conf.d/00-timeouts.conf
        read_only: true
