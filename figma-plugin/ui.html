<!doctype html>
<html>
  <body
    style="
      font-family: sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    "
  >
    <div
      id="history"
      style="
        flex: 1;
        overflow-y: auto;
        margin-bottom: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      "
    ></div>

    <input
      id="componentName"
      type="text"
      placeholder="Component name (optional — defaults to the layer name)"
      style="
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 8px;
        padding: 6px 8px;
        font-family: sans-serif;
      "
    />
    <textarea
      id="prompt"
      placeholder="Optional: describe the component or request a change (e.g. 'make the corners more rounded')"
      style="
        width: 100%;
        height: 60px;
        box-sizing: border-box;
        margin-bottom: 8px;
        font-family: sans-serif;
      "
    ></textarea>
    <button id="generate" style="width: 100%; padding: 8px">Generate component</button>
    <p id="status" style="font-size: 12px; color: #666; margin: 4px 0 0"></p>

    <script>
      const relayUrl = 'https://design-to-code.localhost/generate';
      const statusEl = document.getElementById('status');
      const componentNameEl = document.getElementById('componentName');
      const promptEl = document.getElementById('prompt');
      const historyEl = document.getElementById('history');

      function addBubble(role, text) {
        const bubble = document.createElement('div');
        bubble.textContent = text;
        bubble.style.padding = '6px 10px';
        bubble.style.borderRadius = '10px';
        bubble.style.fontSize = '12px';
        bubble.style.maxWidth = '85%';
        bubble.style.wordBreak = 'break-word';

        if (role === 'designer') {
          bubble.style.alignSelf = 'flex-end';
          bubble.style.background = '#0d99ff';
          bubble.style.color = '#fff';
        } else {
          bubble.style.alignSelf = 'flex-start';
          bubble.style.background = '#f0f0f0';
          bubble.style.color = '#333';
        }

        historyEl.appendChild(bubble);
        historyEl.scrollTop = historyEl.scrollHeight;
      }

      document.getElementById('generate').onclick = () => {
        const promptText = promptEl.value.trim();
        const componentName = componentNameEl.value.trim();
        statusEl.textContent = 'Reading selection...';

        addBubble('designer', promptText || '(generate from design, no extra instructions)');
        promptEl.value = '';

        parent.postMessage(
          { pluginMessage: { type: 'generate', prompt: promptText, componentName } },
          '*'
        );
      };

      // The plugin predicts each task's componentName before any network call
      // (it can't know the relay's sanitization rules), but the relay is the
      // one that actually decides the final, on-disk name (e.g. "Span&Ticker"
      // becomes "SpanTicker"). If a child's real name differs from what was
      // predicted, every later task whose nodeTree references that child via
      // GENERATED_COMPONENT_REF needs patching, or the parent ends up
      // importing a path that was never actually written.
      function patchGeneratedRefs(node, fromName, toName) {
        if (!node || typeof node !== 'object') return;

        if (node.type === 'GENERATED_COMPONENT_REF' && node.generatedComponentName === fromName) {
          node.generatedComponentName = toName;
        }

        if (Array.isArray(node.children)) {
          node.children.forEach((child) => patchGeneratedRefs(child, fromName, toName));
        }
      }

      async function generateTask(task, { prompt, label }) {
        statusEl.textContent = label;

        try {
          const res = await fetch(relayUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              nodeId: task.nodeId,
              componentName: task.componentName,
              nodeTree: task.nodeTree,
              imageBase64: task.imageBase64,
              prompt,
            }),
          });
          const data = await res.json();

          if (res.ok && data.status === 'ok') {
            statusEl.textContent = `Generated ${data.componentName}`;
            addBubble(
              'assistant',
              data.isFollowUp ? `Updated ${data.componentName}.` : `Generated ${data.componentName}.`
            );
            return { ok: true, componentName: data.componentName };
          }

          statusEl.textContent = data.detail ?? data.error ?? 'Generation failed';
          addBubble('assistant', `${task.componentName}: ${data.detail ?? data.error ?? 'Generation failed.'}`);
          return { ok: false };
        } catch (err) {
          statusEl.textContent = 'Could not reach relay server';
          addBubble('assistant', `${task.componentName}: could not reach relay server.`);
          return { ok: false };
        }
      }

      window.onmessage = async (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;

        if (msg.type === 'error') {
          statusEl.textContent = msg.message;
          return;
        }

        if (msg.type === 'plan') {
          const { tasks, prompt } = msg;

          // Children are ordered before their parent. Run them one at a time
          // (not in parallel) so each is a fully independent, atomic
          // generate-and-write step, and so the parent — generated last —
          // can compose whichever children succeeded.
          for (let i = 0; i < tasks.length; i += 1) {
            const task = tasks[i];
            const isRootTask = i === tasks.length - 1;
            const label = tasks.length > 1
              ? `Generating ${task.componentName} (${i + 1}/${tasks.length})...`
              : `Generating ${task.componentName}...`;

            // The designer's free-text prompt describes the thing they
            // selected, not each auto-discovered child, so only the root
            // (final) task gets it.
            const result = await generateTask(task, { prompt: isRootTask ? prompt : undefined, label });

            if (result.ok && result.componentName !== task.componentName) {
              for (let j = i + 1; j < tasks.length; j += 1) {
                patchGeneratedRefs(tasks[j].nodeTree, task.componentName, result.componentName);
              }
            }
          }
        }
      };
    </script>
  </body>
</html>
